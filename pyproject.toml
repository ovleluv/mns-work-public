[project]
name = "mnsim"
version = "0.49.11"
description = "Research tactical M&S / COA wargame prototype (DE + ABM hybrid, TO&E composition combat, fog of war)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["pygame>=2.5,<3"]
dev = ["pygame>=2.5,<3", "pytest>=8,<10", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mnsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:pygame.*"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "tests/upate/analysis"]

[tool.ruff.lint]
# Start with defects only (syntax errors, undefined names, unused/shadowed imports that hide
# bugs); style rules can be enabled incrementally once the dense legacy formatting is migrated.
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
per-file-ignores = { "tests/*" = ["F401", "F811"] }

[tool.mypy]
python_version = "3.10"
files = ["mnsim"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
